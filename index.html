<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeMarket | Modern E-Commerce</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">Vibe<span>Market</span></a>
            <ul class="nav-links">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="products.html">Shop</a></li>
            </ul>
            <div class="nav-actions">
                <button id="theme-toggle" aria-label="Toggle Theme">🌙</button>
                <div class="cart-icon-container">
                    <a href="products.html?view=cart" class="cart-btn">🛒 <span id="cart-count">0</span></a>
                </div>
                <button class="menu-toggle" aria-label="Toggle Menu">☰</button>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1>Elevate Your Everyday Style & Tech</h1>
                <p>Discover our curated collection of premium clothing, accessories, and next-gen electronics designed for modern living.</p>
                <a href="products.html" class="btn btn-primary">Shop Now</a>
            </div>
        </section>

        <section class="featured-section container">
            <h2 class="section-title">Featured Products</h2>
            <div id="featured-products" class="products-grid">
                <!-- Dynamically populated -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 VibeMarket. Built as a portfolio project. Demo Store Only.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
